org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false

# ---------------------------------------------------------------------------
# 版本号单一真源
# ---------------------------------------------------------------------------
# 过去版本号写死在 app/build.gradle.kts，release.sh 另收一个位置参数，
# CI 再用 `grep 'val appVersionName' app/build.gradle.kts` 反解一次，
# 三处独立来源会各自漂移：最坏情况是构建出 versionName 与 tag 不符的 APK，
# 而客户端「检查更新」按 versionName 语义比对，会判定不出更新。
# 现在真源在这里，Gradle、release.sh、CI 三方都从这里读。
tianxuan.versionName=0.22.0
# versionCode 必须随 versionName 单调递增：Android 用它判断能否覆盖安装，
# 同名不同码会让新包装不上旧包。
tianxuan.versionCode=34
# release 变体是否启用 R8 混淆与资源压缩。内测期 false：堆栈可读、排障快、构建快。
# 对外正式发布前改成 true（proguard 规则已就位，无需改代码）。
tianxuan.minify=false
# release 变体是否带 LeakCanary。默认 false —— 它是开发工具，会往桌面上塞一个
# 「Leaks」小鸟图标入口，并靠 manifest ContentProvider 在进程启动阶段自动初始化，
# 与宿主 Application / WorkManager Configuration.Provider 存在冲突面。
# 内测排障请用 debug 包或天玄自研 crashReporter，别把它开在给用户的包里。
# 需要临时开启：./gradlew assembleRelease -Ptianxuan.leakcanary=true
tianxuan.leakcanary=false

# 显式指定本地 JDK 17 路径，防止 Gradle 通过 foojay disco API 下载 toolchain
# （环境无外网访问 api.foojay.io，且本地已装 openjdk-17）。
org.gradle.java.installations.paths=/usr/lib/jvm/java-17-openjdk-amd64,/opt/jdk-25.0.4.1+1
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
