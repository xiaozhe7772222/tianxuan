name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如 v0.11.0，留空则自动从 Gradle 读取)'
        required: false
        default: ''
      draft:
        description: '是否发布为草稿'
        type: boolean
        default: false
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        type: boolean
        default: false

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本号真源在 gradle.properties。这里不做自己的解析，只读取并在 tag
      # 已存在时校验它与真源一致——过去用 `grep 'val appVersionName' app/build.gradle.kts`
      # 反解，一旦 Gradle 改成从属性读（更正确的做法），grep 就会静默返回空串，
      # 产出一个名为 v 的 tag。
      - name: Determine Version Tag
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^tianxuan\.versionName=' gradle.properties | tail -n 1 | cut -d= -f2- | tr -d '[:space:]')
          VERSION_CODE=$(grep -E '^tianxuan\.versionCode=' gradle.properties | tail -n 1 | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::gradle.properties 缺少 tianxuan.versionName"
            exit 1
          fi
          echo "versionName=${VERSION} versionCode=${VERSION_CODE}"

          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi

          # tag 推送触发的构建，tag 必须等于真源版本号。不等就说明有人手改 tag
          # 或忘了同步 gradle.properties，发出去的 APK 会与 tag 不符。
          if [[ "${{ github.ref }}" == refs/tags/* || -n "${{ github.event.inputs.tag_name }}" ]]; then
            EXPECTED="v${VERSION}"
            if [ "$TAG" != "$EXPECTED" ]; then
              echo "::error::tag ${TAG} 与 gradle.properties 的版本号 ${EXPECTED} 不一致，中止发布"
              exit 1
            fi
          fi
          echo "TARGET_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using version tag: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' 包已于 2026-09 被 Google 下线，不能再用默认值（tools platform-tools）
          # 参考 https://github.com/android-actions/setup-android/issues/537
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 从 Secrets 还原签名 keystore
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Decoded release keystore is empty"
            exit 1
          fi
          echo "TIANXUAN_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          TIANXUAN_RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          TIANXUAN_RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          TIANXUAN_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            TIANXUAN_RELEASE_STORE_FILE \
            TIANXUAN_RELEASE_STORE_PASSWORD \
            TIANXUAN_RELEASE_KEY_ALIAS \
            TIANXUAN_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is not configured"
              exit 1
            fi
          done
          keytool -list \
            -keystore "$TIANXUAN_RELEASE_STORE_FILE" \
            -storepass:env TIANXUAN_RELEASE_STORE_PASSWORD \
            -alias "$TIANXUAN_RELEASE_KEY_ALIAS" > /dev/null
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 校验产物身份：不信任 Gradle 声明的版本，直接读 APK 里的清单。
      # 与 tag 不符的包一旦发出去，客户端按 versionName 比对会判定不出更新，
      # 而用户看到的是「已发布新版」。
      - name: Verify APK Identity
        env:
          TAG: ${{ env.TARGET_TAG }}
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          [ -f "$APK_PATH" ] || { echo "::error::未找到 release APK"; exit 1; }
          EXPECT_NAME="${TAG#v}"
          # 读二进制 AXML：Python 标准库即可，不为此在 runner 上装 Android SDK
          IDENTITY=$(python3 - "$APK_PATH" <<'PY'
          import re, sys, zipfile
          # 复用仓库内的解析器，保证 CI 与本地脚本、服务器清单用同一套逻辑
          import importlib.util, os
          spec = importlib.util.spec_from_file_location(
              "apkmanifest", os.path.join(os.getcwd(), "ops", "apkmanifest.py"))
          am = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(am)
          pkg, vn, vc = am.apk_identity(sys.argv[1])
          print("package=%s versionName=%s versionCode=%s" % (pkg, vn, vc))
          PY
          )
          echo "$IDENTITY"
          APK_NAME=$(echo "$IDENTITY" | sed -E 's/.*versionName=([^ ]*).*/\1/')
          APK_NAME="${APK_NAME%%[-+]*}"
          APK_CODE=$(echo "$IDENTITY" | sed -E 's/.*versionCode=([^ ]*).*/\1/')
          SOURCE_CODE=$(grep -E '^tianxuan\.versionCode=' gradle.properties | tail -n 1 | cut -d= -f2- | tr -d '[:space:]')
          if [ "$APK_NAME" != "$EXPECT_NAME" ]; then
            echo "::error::产物 versionName=${APK_NAME} 与 tag ${EXPECT_NAME} 不符"
            exit 1
          fi
          if [ "$APK_CODE" != "$SOURCE_CODE" ]; then
            echo "::error::产物 versionCode=${APK_CODE} 与 gradle.properties 的 ${SOURCE_CODE} 不符"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Identify and Rename Output APK
        run: |
          mkdir -p output
          APK_PATH="${{ env.APK_PATH }}"
          if [ -f "$APK_PATH" ]; then
            TAG="${{ env.TARGET_TAG }}"
            cp "$APK_PATH" "output/TianXuan-arm64-${TAG}.apk"
            sha256sum "output/TianXuan-arm64-${TAG}.apk" > "output/TianXuan-arm64-${TAG}.apk.sha256"
            echo "APK_FILE=output/TianXuan-arm64-${TAG}.apk" >> $GITHUB_ENV
            echo "SHA_FILE=output/TianXuan-arm64-${TAG}.apk.sha256" >> $GITHUB_ENV
            echo "TAG=$TAG" >> $GITHUB_ENV
          else
            echo "Error: No release APK generated!" && exit 1
          fi

      # 生成两个相邻版本标签之间的 git 提交日志作为 Release Notes
      - name: Generate Changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ env.TARGET_TAG }}"
          # 找到上一个版本标签
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          echo "当前版本：$CURRENT_TAG，上一版本：$PREV_TAG"

          if git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
            CURRENT_REF="$CURRENT_TAG"
          else
            CURRENT_REF="HEAD"
          fi

          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log -n 50 --pretty=format:"- %s (%h)" "$CURRENT_REF")
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${CURRENT_REF}")
          fi

          # 按 feat/fix/perf/refactor/chore 分组归类
          FEAT=$(echo "$LOG" | grep -i "^- feat" || true)
          FIX=$(echo "$LOG" | grep -i "^- fix" || true)
          PERF=$(echo "$LOG" | grep -i "^- perf\|^- refactor\|^- improve" || true)
          CHORE=$(echo "$LOG" | grep -Eiv "^- feat|^- fix|^- perf|^- refactor|^- improve" || true)

          {
            echo "## 天玄 $CURRENT_TAG 更新说明"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "> 本版本包含自 \`$PREV_TAG\` 起的全部变更"
            fi
            echo ""
            if [ -n "$FEAT" ]; then
              echo "### ✨ 新特性"
              echo "$FEAT"
              echo ""
            fi
            if [ -n "$FIX" ]; then
              echo "### 🐛 Bug 修复"
              echo "$FIX"
              echo ""
            fi
            if [ -n "$PERF" ]; then
              echo "### ⚡ 性能与优化"
              echo "$PERF"
              echo ""
            fi
            if [ -n "$CHORE" ]; then
              echo "### 🔧 其他变更"
              echo "$CHORE"
              echo ""
            fi
            echo "---"
            echo "**SHA-256 校验**"
            echo "\`\`\`"
            cat "${{ env.SHA_FILE }}"
            echo "\`\`\`"
          } > release_notes.md

          echo "RELEASE_NOTES_FILE=release_notes.md" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: output/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: "天玄 ${{ env.TARGET_TAG }}"
          body_path: release_notes.md
          files: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
