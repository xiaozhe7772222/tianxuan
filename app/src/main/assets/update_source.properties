# 天玄 · 更新源配置
#
# 应用内「检查更新」与「关于」页的仓库坐标、版本清单地址均读此处。
# 换发布源只需改本文件，无需改动 Kotlin 代码。
# 实现见 core/network/.../UpdateSourceConfig.kt
#
# 私有仓库的 Releases API 对未认证请求返回 404，故默认走自建服务；
# 其字段与 GitHub Releases API 同构，两端可无缝互换。
# 开源时把 update.repoUrl 指向公开库、并把 baseUrl 留空用 GitHub 端点即可。

# owner/repo
update.repo=xiaozhe7772222/tianxuan

# 自建服务基址（经 nginx 反代到子路径）。update.manifestUrl 留空时按
# baseUrl + manifestPrefix + latest 拼出。
update.baseUrl=https://124.222.37.253
update.manifestPrefix=/tx-update/

# 完整清单地址。留空则由上面两项拼出。
update.manifestUrl=https://124.222.37.253/tx-update/latest

# 备用清单地址，逗号分隔、按序尝试。公开仓库可填 releases/latest。
update.fallbackUrls=

# 版本详情页（「查看更新说明」跳转）
update.versionsUrl=https://124.222.37.253/tx-update/versions

# 开源仓库主页（「关于」页展示用）
update.repoUrl=https://github.com/xiaozhe7772222/tianxuan